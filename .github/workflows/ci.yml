name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # Phase 1: The Quality Guardrail (Continuous Integration)
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Application Tests
        run: npm test

  # Phase 2: The Package Factory (Continuous Delivery)
  continuous-delivery:
    needs: continuous-integration # Only run this if the tests pass!
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # This automatically tags the image with your Docker Hub username
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-demo-app:latest
